[project]
name = "webforms-scrapper"
version = "0.1.0"
description = "Production-grade scraper for legacy ASP.NET WebForms applications."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Asifur" }]
dependencies = [
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.2",
    "openpyxl>=3.1.5",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "requests-mock>=1.12.1",
    "ruff>=0.16.5",
    "types-requests>=2.33.0.20260712",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scraper"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RET", "ARG", "PTH", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "bs4.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["scraper"]


